<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수업 바로가기 웹앱</title>
    <style>
        /* 기본 배경 및 폰트 설정 */
        body { 
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; 
            padding: 20px; 
            max-width: 500px; 
            margin: 0 auto; 
            background-color: #f4f7f6;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        /* 메인 버튼(아코디언) 및 일반 링크 버튼 공통 스타일 */
        .menu-btn, .link-btn { 
            background-color: #4b6cb7; 
            color: white; 
            padding: 15px 20px; 
            width: 100%; 
            border: none; 
            font-size: 18px; 
            font-weight: bold;
            border-radius: 8px; 
            margin-top: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            box-sizing: border-box;
            transition: background-color 0.2s;
        }
        .menu-btn {
            text-align: left; 
            cursor: pointer; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .link-btn {
            display: block;
            text-align: center;
            text-decoration: none;
        }
        .menu-btn:hover, .link-btn:hover { 
            background-color: #3a5494; 
        }
        
        /* 하위 링크 컨테이너 (초기에는 숨김) */
        .dropdown-content { 
            display: none; 
            background-color: #ffffff; 
            border-radius: 8px; 
            margin-top: 5px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        /* 하위 링크 스타일 */
        .dropdown-content a { 
            display: block; 
            padding: 15px 20px; 
            text-decoration: none; 
            color: #4b6cb7; 
            font-weight: 500;
            border-bottom: 1px solid #eee; 
        }
        .dropdown-content a:last-child { 
            border-bottom: none; 
        }
        .dropdown-content a:hover { 
            background-color: #f0f4f8; 
        }
    </style>
</head>
<body>

    <h2>🔗 수업 바로가기 모음</h2>

    <!-- 1. 지오지브라 드롭다운 버튼 -->
    <button class="menu-btn" onclick="toggleMenu('geogebra-menu')">
        <span>지오지브라</span>
        <span>▼</span>
    </button>
    
    <!-- 지오지브라 하위 메뉴 -->
    <div id="geogebra-menu" class="dropdown-content">
        <a href="https://www.geogebra.org/m/wbza38s2" target="_blank">📐 기하 개념 열기</a>
        <a href="https://www.notion.so/359306bcfb29804d96c9f26a48233b3b?source=copy_link" target="_blank">📝 지오지브라 활동지</a>
    </div>

    <!-- 2. 추가된 웹앱 바로가기 버튼 -->
    <a href="https://nakji001-netizen.github.io/webapp/" target="_blank" class="link-btn">
        🌐 웹앱 접속하기
    </a>

    <!-- 3. 추가된 웹앱 코드(구글 드라이브) 바로가기 버튼 -->
    <a href="https://drive.google.com/drive/folders/1CYlW07Ph86P18FTEuwKECjl55RhRX68B?usp=sharing" target="_blank" class="link-btn">
        📁 웹앱 코드 보기
    </a>

    <script>
        // 버튼 클릭 시 하위 메뉴를 보이거나 숨기는 자바스크립트 함수
        function toggleMenu(id) {
            var menu = document.getElementById(id);
            if (menu.style.display === "block") {
                menu.style.display = "none";
            } else {
                menu.style.display = "block";
            }
        }
    </script>

</body>
</html>
